name: rishikesh_enterprises
description: Rishikesh Enterprises — Havells dealer & electricals, Hajipur. Customer shopping app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.6.0

  # Native "Continue with Google" account picker (Android) — its ID token is
  # exchanged for a Supabase session via supabase.auth.signInWithIdToken;
  # Supabase never sees this app's Google credentials, only the token.
  google_sign_in: ^7.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Payments
  razorpay_flutter: ^1.3.7

  # Images
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0

  # UI / UX niceties
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  smooth_page_indicator: ^1.2.0

  # Local persistence (cart survives app restarts, before login)
  shared_preferences: ^2.3.2

  # Location (for "use current location" on delivery address). Product/seller
  # image uploads happen in the separate seller web dashboard (seller-web/),
  # not in this customer app, so no camera/gallery permission is requested
  # here — the app only asks for what it actually uses (location, for
  # delivery addresses), keeping the Play Store permission footprint minimal.
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Seller dashboard — embeds the existing seller-web/ HTML/CSS/JS
  # dashboard (bundled as an asset, see mobile/assets/seller-web/)
  # inside a WebView instead of rebuilding it natively.
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/seller-web/
